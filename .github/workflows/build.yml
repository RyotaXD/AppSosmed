name: Build APK RyotaXD

on: 
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Build APK Flet
        run: yes | flet build apk --product "AppSosmed" --org "com.appsosmed"


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RyotaXD-Downloader-APK
          path: build/apk/**/*.apk
