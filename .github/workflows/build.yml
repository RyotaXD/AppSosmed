name: Build AppSosmed

on: 
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Build APK Flet
        run: flet build apk --product "AppSosmed" --org "com.appsosmed" --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppSosmed-APK
          path: build/apk/**/*.apk
